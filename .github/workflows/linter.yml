name: Python linter

on: pull_request

jobs:
  lint: # The name of the job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff

      - name: Run Ruff y guardar salida
        # Guardamos la salida de ruff para inspección si falla el job.
        # `set -o pipefail` hace que el paso refleje correctamente el código de salida.
        run: |
          set -o pipefail
          ruff check --select E --select I 2>&1 | tee ruff_output.txt

      - name: Subir artefacto de linter
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-logs
          path: ruff_output.txt
