name: "Linter"
description: "Corriendo linter sobre el codigo"

runs:
  using: "composite"
  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Instalar Ruff
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff

    - name: Ejecutar Ruff
      shell: bash
      run: |
        ruff check --select E --select I .
